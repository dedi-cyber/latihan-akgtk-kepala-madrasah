<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Soal AKGTK Kepala Madrasah 2026</title>
<style>
:root{--bg:#F2F5F3;--panel:#FFFFFF;--ink:#16231E;--mute:#5A6B64;--line:#CBD6D0;--acc:#0B6B4F;--accT:#FFFFFF;--bad:#B3261E;--ok:#0B6B4F;--okBg:#DCEFE6;--badBg:#F8DEDB;--flag:#B7791F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A16;--panel:#16251F;--ink:#E6EFEA;--mute:#9DB0A7;--line:#2B3F37;--acc:#4CC49A;--accT:#06251A;--bad:#FF8A80;--ok:#4CC49A;--okBg:#173A2D;--badBg:#472320;--flag:#E3B15C}}
:root[data-theme="dark"]{--bg:#0F1A16;--panel:#16251F;--ink:#E6EFEA;--mute:#9DB0A7;--line:#2B3F37;--acc:#4CC49A;--accT:#06251A;--bad:#FF8A80;--ok:#4CC49A;--okBg:#173A2D;--badBg:#472320;--flag:#E3B15C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 6px}
h2{font-size:1.15rem;margin:22px 0 8px}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;max-width:60%}
input[type=number]{width:84px;text-align:right}
button{font:inherit;font-weight:600;background:var(--acc);color:var(--accT);border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:.85rem;color:var(--mute)}
.q{font-size:1.05rem;margin:0 0 12px;white-space:pre-line}
.opt{display:flex;gap:10px;width:100%;text-align:left;font-weight:400;background:var(--bg);color:var(--ink);border:1px solid var(--line);margin:0 0 8px;padding:10px 12px}
.opt b{min-width:1.2em}
.opt.sel{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.opt.ok{background:var(--okBg);border-color:var(--ok)}
.opt.no{background:var(--badBg);border-color:var(--bad)}
.pem{border-left:3px solid var(--acc);padding:4px 12px;margin:10px 0 0;color:var(--ink)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:6px}
.nav button{padding:6px 0;font-weight:500;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.nav .done{background:var(--okBg);border-color:var(--ok)}
.nav .fl{border-color:var(--flag);box-shadow:inset 0 -3px 0 var(--flag)}
.nav .cur{outline:2px solid var(--acc);outline-offset:1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.big{font:700 2.6rem/1 Georgia,serif;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td:not(:first-child),th:not(:first-child){text-align:right}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:.88rem}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:12px}
.m{display:block;text-align:left;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:400;padding:14px 16px}
.m b{display:block;font-family:Georgia,serif;font-size:1.05rem;margin-bottom:4px}
.m:hover{border-color:var(--acc)}
input[type=text]{font:inherit;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:6px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.good{color:var(--ok)}.badc{color:var(--bad)}
</style>
</head>
<body>

<script>
const Q=[{"m":0,"q":"Menjelang penyusunan Rencana Kerja Madrasah (RKM), tim perumus mengusulkan agar program tahun lalu disalin dengan penyesuaian angka anggaran saja, karena dinilai lebih efisien. Langkah kepala madrasah yang paling tepat adalah …","o":["Menyetujui usulan karena program tahun lalu sudah terbukti berjalan.","Menolak usulan dan menyusun sendiri RKM agar lebih cepat selesai.","Mengembalikan proses pada Evaluasi Diri Madrasah dan rapor pendidikan, sehingga program yang disusun berangkat dari data capaian dan akar masalah nyata.","Menyerahkan penyusunan RKM sepenuhnya kepada operator madrasah.","Menunda penyusunan RKM sampai ada arahan teknis dari Kantor Kementerian Agama."],"k":2,"p":"Perencanaan madrasah harus berbasis bukti. EDM dan rapor pendidikan memastikan program menjawab akar masalah, bukan sekadar mengulang kegiatan tahun lalu.","t":"C5 • perencanaan berbasis data"},{"m":0,"q":"Rumusan visi madrasah yang paling memenuhi kaidah perumusan visi adalah …","o":["\"Melaksanakan pembelajaran yang aktif, kreatif, dan menyenangkan setiap hari.\"","\"Terwujudnya generasi madrasah yang berakhlak mulia, unggul dalam literasi, dan peduli lingkungan pada tahun 2030.\"","\"Meningkatkan jumlah peserta didik baru sebanyak 10% setiap tahun.\"","\"Menyelenggarakan kegiatan ekstrakurikuler yang beragam dan bermutu.\"","\"Menjadi madrasah terbaik tanpa kecuali di seluruh Indonesia.\""],"k":1,"p":"Visi yang baik berorientasi masa depan, menggambarkan kondisi ideal yang ingin dicapai, terukur, dan realistis. Pilihan lain merupakan misi (kegiatan), target operasional, atau klaim yang tidak realistis.","t":"C5 • visi, misi, dan tujuan madrasah"},{"m":0,"q":"Rapor pendidikan madrasah menunjukkan: kemampuan literasi rendah, iklim keamanan madrasah rendah, dan kualitas pembelajaran sedang. Prioritas pembenahan yang paling tepat adalah …","o":["Membenahi iklim keamanan lebih dahulu, karena rasa aman merupakan prasyarat agar peserta didik dapat belajar dan intervensi literasi berjalan efektif.","Menambah jam pelajaran Bahasa Indonesia untuk mengejar capaian literasi.","Memperbaiki seluruh indikator secara serentak agar tidak ada yang tertinggal.","Memfokuskan anggaran pada pengadaan buku bacaan sebanyak-banyaknya.","Menunggu hasil rapor tahun berikutnya untuk memastikan datanya konsisten."],"k":0,"p":"Iklim keamanan merupakan prasyarat belajar. Tanpa rasa aman, intervensi literasi sulit berhasil, sehingga pembenahan iklim didahulukan atau dijalankan sebagai fondasi.","t":"C5 • analisis rapor pendidikan dan penetapan prioritas"},{"m":0,"q":"Praktik yang paling mencerminkan kepemimpinan pembelajaran (instructional leadership) seorang kepala madrasah adalah …","o":["Memastikan seluruh administrasi guru lengkap sebelum pengawas datang.","Menyelesaikan seluruh urusan keuangan dan sarana agar guru tidak terganggu.","Menghadiri setiap undangan dinas untuk menjaga hubungan baik.","Menyediakan waktu rutin masuk kelas, menganalisis capaian belajar murid bersama guru, dan memimpin komunitas belajar untuk memperbaiki praktik mengajar.","Mendelegasikan urusan akademik sepenuhnya kepada wakil kepala bidang kurikulum."],"k":3,"p":"Kepemimpinan pembelajaran berpusat pada proses belajar murid: kehadiran di kelas, analisis data capaian, dan pembinaan praktik mengajar melalui komunitas belajar.","t":"C4 • kepemimpinan pembelajaran"},{"m":0,"q":"Beberapa guru senior menolak penerapan pembelajaran mendalam dengan alasan \"cara lama sudah terbukti\". Tindakan kepala madrasah yang paling efektif adalah …","o":["Menerbitkan surat edaran yang mewajibkan penerapan disertai sanksi.","Membiarkan mereka mengajar dengan cara lama demi menjaga keharmonisan.","Mengganti mereka dengan guru muda pada kelas-kelas utama.","Mengumumkan daftar guru yang belum menerapkan dalam rapat dewan guru.","Mengajak mereka menguji coba pada satu topik, mendampingi prosesnya, lalu membahas bersama bukti perubahan keterlibatan dan hasil belajar murid."],"k":4,"p":"Perubahan diterima bila didasarkan pada pengalaman keberhasilan yang dirasakan sendiri. Uji coba terbatas dengan pendampingan dan bukti dampak lebih efektif daripada instruksi atau tekanan.","t":"C5 • manajemen perubahan"},{"m":0,"q":"Dua guru berselisih karena pembagian jam mengajar dan saling menyindir di grup madrasah. Langkah pertama kepala madrasah yang paling tepat adalah …","o":["Memanggil keduanya bersama seluruh dewan guru untuk diberi teguran.","Membubarkan grup percakapan madrasah agar konflik berhenti.","Menyerahkan penyelesaian kepada wakil kepala madrasah.","Menemui masing-masing secara terpisah untuk memahami persoalan dan kepentingan sebenarnya, sebelum mempertemukan keduanya mencari solusi bersama.","Mengubah jadwal mengajar keduanya tanpa pembicaraan agar segera selesai."],"k":3,"p":"Langkah pertama manajemen konflik adalah memahami kepentingan masing-masing pihak secara terpisah, sebelum mempertemukan mereka untuk mencari solusi bersama.","t":"C5 • manajemen konflik"},{"m":0,"q":"Kepala madrasah harus memutuskan penggunaan dana mendesak untuk perbaikan atap kelas yang bocor pada musim hujan. Gaya pengambilan keputusan yang paling tepat dalam situasi tersebut adalah …","o":["Musyawarah panjang dengan seluruh warga madrasah hingga tercapai mufakat.","Menunggu rapat komite yang dijadwalkan dua bulan lagi.","Mengambil keputusan cepat berbasis data kerusakan dan aturan penggunaan dana, lalu segera menyampaikannya secara terbuka kepada warga madrasah dan komite.","Menyerahkan keputusan kepada bendahara karena menyangkut anggaran.","Mengumpulkan sumbangan dari orang tua tanpa mekanisme resmi."],"k":2,"p":"Kepemimpinan situasional: situasi mendesak yang menyangkut keselamatan menuntut keputusan cepat berbasis data dan aturan, dengan komunikasi terbuka setelahnya sebagai penjaga akuntabilitas.","t":"C5 • pengambilan keputusan situasional"},{"m":0,"q":"Prinsip pengelolaan dana bantuan pemerintah di madrasah yang paling tepat adalah …","o":["Cukup dicatat oleh bendahara dan dilaporkan pada akhir tahun anggaran.","Direncanakan partisipatif, dibelanjakan sesuai peruntukan, dibukukan tertib, dipertanggungjawabkan tepat waktu, dan dipublikasikan kepada warga madrasah.","Diutamakan untuk kebutuhan yang paling mudah dipertanggungjawabkan.","Dikelola sepenuhnya oleh kepala madrasah agar keputusan lebih cepat.","Disimpan sebagian sebagai cadangan tanpa dicantumkan dalam laporan."],"k":1,"p":"Pengelolaan dana publik menuntut perencanaan partisipatif, kesesuaian peruntukan, pembukuan tertib, pertanggungjawaban tepat waktu, dan keterbukaan informasi.","t":"C4 • akuntabilitas keuangan"},{"m":0,"q":"Sebuah madrasah memiliki 360 peserta didik dengan dana bantuan operasional Rp1.400.000,00 per peserta didik per tahun. Madrasah merencanakan 20% dari total dana untuk pengembangan kompetensi pendidik dan tenaga kependidikan. Besar alokasi tersebut adalah …","o":["Rp50.400.000,00","Rp75.600.000,00","Rp100.800.000,00","Rp126.000.000,00","Rp151.200.000,00"],"k":2,"p":"Total dana = 360 × Rp1.400.000,00 = Rp504.000.000,00. Alokasi 20% = Rp100.800.000,00.","t":"C4 • perencanaan anggaran"},{"m":0,"q":"Dana terbatas, sedangkan kebutuhan mendesak meliputi: (1) perbaikan toilet peserta didik yang rusak; (2) pengadaan proyektor tambahan; (3) pengecatan pagar depan; (4) pelatihan guru tentang asesmen. Skala prioritas yang paling tepat adalah …","o":["(1), (4), (2), (3) — mendahulukan kesehatan dan keselamatan murid serta mutu pembelajaran.","(3), (2), (1), (4) — mendahulukan citra madrasah di mata masyarakat.","(2), (3), (4), (1) — mendahulukan sarana yang terlihat modern.","(4), (3), (2), (1) — mendahulukan kegiatan yang mudah dilaporkan.","(2), (1), (3), (4) — mendahulukan kebutuhan guru dalam mengajar."],"k":0,"p":"Prioritas ditentukan oleh urgensi dan dampak pada murid: keselamatan dan kesehatan lebih dahulu, disusul peningkatan mutu pembelajaran, baru kebutuhan estetika.","t":"C5 • skala prioritas dan keberpihakan pada murid"},{"m":0,"q":"Madrasah tsanawiyah menerima 288 peserta didik baru. Jika jumlah maksimal peserta didik per rombongan belajar adalah 32 orang, jumlah rombongan belajar minimal yang harus disiapkan adalah …","o":["8 rombel","9 rombel","10 rombel","11 rombel","12 rombel"],"k":1,"p":"288 : 32 = 9 rombongan belajar.","t":"C3 • pengelolaan kesiswaan"},{"m":0,"q":"Seorang peserta didik melontarkan ujaran yang merendahkan keyakinan kelompok lain di media sosial, dan hal itu menjadi perbincangan warga madrasah. Tindakan kepala madrasah yang paling tepat adalah …","o":["Langsung mengeluarkan peserta didik tersebut agar menjadi pelajaran bagi yang lain.","Menutup kasus secara diam-diam agar nama madrasah tidak tercoreng.","Menangani kasus secara mendidik — mengklarifikasi, melibatkan orang tua dan guru BK, memulihkan pihak yang terdampak, lalu memperkuat program penguatan moderasi beragama secara sistemik.","Meminta peserta didik menghapus unggahan dan menganggap persoalan selesai.","Menyerahkan seluruh penanganan kepada aparat penegak hukum."],"k":2,"p":"Penanganan harus mendidik dan sistemik: klarifikasi, pelibatan orang tua dan guru BK, pemulihan pihak terdampak, serta penguatan program moderasi beragama agar tidak berulang.","t":"C5 • budaya madrasah • moderasi beragama • cinta sesama"},{"m":0,"q":"Kepala madrasah ingin membangun budaya belajar bersama di kalangan guru. Strategi yang paling berkelanjutan adalah …","o":["Mengirim guru mengikuti seminar sebanyak mungkin setiap semester.","Mewajibkan guru membuat laporan bacaan setiap bulan.","Memberikan penghargaan uang bagi guru yang paling rajin mengikuti pelatihan.","Mendatangkan narasumber luar setiap awal tahun pelajaran.","Membentuk komunitas belajar dalam madrasah dengan jadwal tetap, agenda berbasis masalah nyata di kelas, dan siklus refleksi yang dipimpin bergiliran oleh guru."],"k":4,"p":"Komunitas belajar dalam madrasah bersifat melekat pada pekerjaan sehari-hari, berbiaya rendah, dan berkelanjutan — berbeda dari pelatihan sesaat yang bergantung pihak luar.","t":"C5 • pengembangan SDM"},{"m":0,"q":"Ditemukan perbedaan antara jumlah peserta didik pada data EMIS dan data riil di kelas menjelang batas waktu pemutakhiran. Tindakan kepala madrasah yang paling tepat adalah …","o":["Menugaskan verifikasi berjenjang oleh wali kelas terhadap dokumen peserta didik, memperbaiki data sesuai keadaan sebenarnya, lalu menetapkan mekanisme pemutakhiran berkala agar tidak berulang.","Menyesuaikan data riil agar sama dengan data EMIS supaya tidak menimbulkan pertanyaan.","Membiarkan selisih kecil karena tidak berpengaruh signifikan.","Menyerahkan sepenuhnya kepada operator tanpa pengendalian.","Menunda pemutakhiran hingga tahun pelajaran berikutnya."],"k":0,"p":"Integritas data menuntut verifikasi terhadap keadaan sebenarnya, bukan penyesuaian data riil agar cocok dengan sistem. Perbaikan sistemik mencegah masalah berulang.","t":"C5 • tata kelola data dan integritas"},{"m":0,"q":"Peran komite madrasah yang sesuai dengan ketentuan tata kelola adalah …","o":["Menentukan penempatan dan mutasi guru di madrasah.","Menetapkan besaran iuran wajib bagi seluruh orang tua peserta didik.","Mengelola langsung keuangan madrasah bersama bendahara.","Memberi pertimbangan, dukungan, dan pengawasan terhadap penyelenggaraan pendidikan, serta menjadi mediator antara madrasah dan masyarakat.","Menentukan kurikulum dan jadwal pembelajaran madrasah."],"k":3,"p":"Komite madrasah berperan memberi pertimbangan, dukungan, pengawasan, dan menjadi mediator — bukan pelaksana manajemen atau pengelola keuangan.","t":"C4 • hubungan madrasah dan masyarakat"},{"m":0,"q":"Urutan siklus Sistem Penjaminan Mutu Internal (SPMI) madrasah yang tepat adalah …","o":["Perencanaan → pemetaan mutu → pelaksanaan → penetapan standar → evaluasi.","Pemetaan mutu → penyusunan rencana pemenuhan mutu → pelaksanaan pemenuhan mutu → evaluasi/audit mutu → penetapan standar mutu baru.","Akreditasi → pemetaan mutu → perencanaan → pelaksanaan → pelaporan.","Penetapan standar → pelaporan → pemetaan → perencanaan → evaluasi.","Pelaksanaan → evaluasi → pemetaan → perencanaan → pelaporan."],"k":1,"p":"Siklus SPMI: pemetaan mutu → perencanaan pemenuhan → pelaksanaan → evaluasi/audit → penetapan standar mutu baru, lalu berulang.","t":"C4 • penjaminan mutu"},{"m":0,"q":"Madrasah berada di kawasan rawan banjir. Wujud manajemen risiko yang paling tepat adalah …","o":["Meliburkan peserta didik setiap kali turun hujan deras.","Memindahkan seluruh dokumen ke lantai atas saat banjir datang.","Menyusun peta risiko, prosedur tanggap darurat, jalur evakuasi, penyelamatan dokumen dan data, serta melatihnya secara berkala bersama seluruh warga madrasah.","Mengasuransikan seluruh aset madrasah sebagai satu-satunya langkah.","Mengusulkan relokasi madrasah dan menunggu persetujuan anggaran."],"k":2,"p":"Manajemen risiko bersifat antisipatif dan sistemik: identifikasi risiko, prosedur tanggap darurat, jalur evakuasi, pengamanan data, dan latihan berkala.","t":"C5 • manajemen risiko dan keselamatan"},{"m":0,"q":"Kepala madrasah dinilai selalu sibuk karena hampir semua urusan ditanganinya sendiri. Perbaikan yang paling tepat adalah …","o":["Menambah jam kerja dan datang lebih pagi setiap hari.","Mengurangi jumlah program madrasah agar beban berkurang.","Mengangkat lebih banyak wakil kepala madrasah tanpa uraian tugas.","Mendelegasikan kewenangan disertai uraian tugas, target, dan mekanisme pelaporan yang jelas, sambil membina kemampuan penerima delegasi.","Menyerahkan tugas kepada guru yang paling senior tanpa pendampingan."],"k":3,"p":"Pendelegasian efektif memerlukan kejelasan kewenangan, uraian tugas, target, mekanisme pelaporan, dan pembinaan — sekaligus menjadi sarana kaderisasi kepemimpinan.","t":"C5 • pendelegasian dan kaderisasi"},{"m":0,"q":"Beberapa guru bukan ASN mengeluhkan honor yang kecil dan mulai menurun motivasinya. Langkah kepala madrasah yang paling tepat dan berkelanjutan adalah …","o":["Menjanjikan kenaikan honor tanpa kepastian sumber dana.","Meminta guru bersabar karena keterbatasan anggaran adalah hal biasa.","Mengurangi jumlah guru agar honor yang tersedia dapat dibagi lebih besar.","Menaikkan iuran orang tua untuk menutupi kekurangan honor.","Mengoptimalkan alokasi anggaran yang sah, mengembangkan sumber pendapatan halal madrasah, sekaligus memperkuat penghargaan nonfinansial seperti pengembangan karier dan pengakuan atas prestasi."],"k":4,"p":"Solusi berkelanjutan memadukan optimalisasi anggaran yang sah, pengembangan pendapatan halal madrasah, dan penghargaan nonfinansial, tanpa membebani orang tua.","t":"C5 • kesejahteraan dan motivasi SDM • cinta sesama"},{"m":0,"q":"Penerapan Kurikulum Cinta pada tataran kebijakan madrasah paling tepat diwujudkan melalui …","o":["Penyelarasan seluruh kebijakan madrasah — tata tertib, pembiasaan, penanganan pelanggaran, hingga relasi guru-murid — agar konsisten menumbuhkan kasih sayang, penghormatan pada keragaman, dan kepedulian terhadap sesama dan alam.","Penambahan slogan dan spanduk bertema cinta di lingkungan madrasah.","Penambahan satu mata pelajaran khusus bernama Kurikulum Cinta.","Pelaksanaan kegiatan bakti sosial sekali dalam satu tahun pelajaran.","Penghapusan seluruh sanksi bagi peserta didik yang melanggar tata tertib."],"k":0,"p":"Kurikulum Cinta bukan program tambahan, melainkan nilai yang harus konsisten tercermin dalam seluruh kebijakan, pembiasaan, dan relasi di madrasah.","t":"C5 • Kurikulum Cinta pada tataran kebijakan"},{"m":1,"q":"Prinsip supervisi akademik yang paling tepat adalah …","o":["Bersifat rahasia agar guru tidak merasa diawasi.","Bersifat mendadak agar tergambar keadaan yang sebenarnya.","Bersifat menilai untuk menentukan peringkat guru di madrasah.","Bersifat administratif untuk memastikan kelengkapan dokumen guru.","Bersifat kolegial, berkelanjutan, objektif, dan berorientasi pada perbaikan praktik mengajar demi peningkatan hasil belajar murid."],"k":4,"p":"Supervisi akademik bersifat kolegial, objektif, berkelanjutan, dan bertujuan memperbaiki praktik mengajar demi hasil belajar murid — bukan mengawasi atau memeringkat guru.","t":"C4 • prinsip supervisi akademik"},{"m":1,"q":"Urutan tahapan supervisi klinis yang tepat adalah …","o":["Observasi kelas → pertemuan awal → pertemuan balikan.","Pertemuan awal → pertemuan balikan → observasi kelas.","Pertemuan awal (kesepakatan fokus dan instrumen) → observasi kelas → pertemuan balikan dan penyusunan rencana tindak lanjut.","Penilaian kinerja → observasi kelas → pelaporan kepada pengawas.","Observasi kelas → penilaian → pemberian sanksi atau penghargaan."],"k":2,"p":"Supervisi klinis berlangsung dalam tiga tahap: pertemuan awal untuk menyepakati fokus dan instrumen, observasi kelas, lalu pertemuan balikan dan rencana tindak lanjut.","t":"C4 • tahapan supervisi klinis"},{"m":1,"q":"Seorang guru berpengalaman dengan kinerja baik dan kemampuan refleksi tinggi akan disupervisi. Pendekatan supervisi yang paling sesuai adalah …","o":["Direktif, dengan memberikan instruksi rinci tentang cara mengajar yang benar.","Direktif, dengan memberikan contoh mengajar langsung di depan kelasnya.","Kolaboratif, dengan menyusun bersama seluruh langkah perbaikan.","Non-direktif, dengan mendengarkan refleksi guru dan mendorongnya merumuskan sendiri perbaikan yang akan dilakukan.","Tidak perlu disupervisi karena kinerjanya sudah baik."],"k":3,"p":"Pendekatan supervisi disesuaikan dengan tingkat komitmen dan kemampuan berpikir abstrak guru. Guru berpengalaman dengan refleksi tinggi paling tepat didampingi secara non-direktif.","t":"C5 • pendekatan supervisi diferensial"},{"m":1,"q":"Kepala madrasah ingin menyupervisi kualitas interaksi guru-murid dalam pembelajaran. Instrumen yang paling tepat adalah …","o":["Lembar observasi dengan indikator perilaku teramati disertai catatan anekdot dan rekaman waktu bicara guru-murid.","Angket kepuasan orang tua terhadap guru yang bersangkutan.","Daftar periksa kelengkapan modul ajar dan perangkat administrasi.","Rekapitulasi nilai ulangan harian peserta didik selama satu semester.","Daftar hadir guru dan catatan keterlambatan masuk kelas."],"k":0,"p":"Fokus supervisi menentukan instrumen. Kualitas interaksi hanya terekam melalui observasi perilaku teramati, catatan anekdot, dan data proporsi bicara guru-murid.","t":"C5 • instrumen supervisi"},{"m":1,"q":"Pada pertemuan balikan, kepala madrasah menemukan bahwa guru mendominasi pembicaraan selama hampir seluruh jam pelajaran. Cara menyampaikan balikan yang paling tepat adalah …","o":["\"Cara mengajar Bapak terlalu berpusat pada guru, harus segera diubah.\"","\"Dari catatan saya, murid berbicara sekitar tiga menit dari 60 menit pembelajaran. Menurut Bapak, apa yang membuat hal itu terjadi, dan apa yang mungkin bisa kita coba pada pertemuan berikutnya?\"","\"Secara umum pembelajaran Bapak sudah baik, lanjutkan saja.\"","\"Banyak guru lain sudah menerapkan diskusi kelompok, Bapak sebaiknya mengikuti.\"","\"Saya akan mencatat temuan ini dalam penilaian kinerja Bapak.\""],"k":1,"p":"Balikan efektif berangkat dari data teramati, bukan penilaian pribadi, dan diakhiri pertanyaan reflektif yang menempatkan guru sebagai pemilik perbaikan.","t":"C5 • umpan balik supervisi berbasis data"},{"m":1,"q":"Dalam percakapan coaching, peran kepala madrasah yang paling tepat adalah …","o":["Memberikan nasihat terbaik berdasarkan pengalaman pribadinya.","Menggali tujuan, memetakan kenyataan, membuka alternatif, dan menuntun guru menetapkan sendiri komitmen tindakannya melalui pertanyaan terbuka.","Menganalisis kelemahan guru lalu menyampaikan solusi yang harus dijalankan.","Mengevaluasi hasil kerja guru dan menetapkan targetnya.","Mengajarkan teknik mengajar yang dikuasai kepala madrasah."],"k":1,"p":"Dalam coaching, kepala madrasah bersikap sebagai mitra berpikir melalui pertanyaan terbuka, bukan pemberi nasihat, penilai, atau pengajar.","t":"C4 • coaching dan mentoring"},{"m":1,"q":"Hasil supervisi akademik terhadap 24 guru adalah sebagai berikut.\nAmat Baik: 6 guru. Baik: 10 guru. Cukup: 6 guru. Kurang: 2 guru.\nPersentase guru yang berada pada kategori Baik dan Amat Baik adalah …","o":["8,3%","25,0%","33,3%","41,7%","66,7%"],"k":4,"p":"(6 + 10) : 24 = 16/24 = 66,7%.","t":"C4 • analisis data hasil supervisi"},{"m":1,"q":"Hasil supervisi akademik terhadap 24 guru adalah sebagai berikut.\nAmat Baik: 6 guru. Baik: 10 guru. Cukup: 6 guru. Kurang: 2 guru.\nTindak lanjut yang paling tepat adalah …","o":["Mengulang supervisi terhadap seluruh guru pada semester yang sama.","Memberikan pelatihan seragam kepada seluruh guru dengan materi yang sama.","Melaporkan guru berkategori kurang kepada pengawas untuk ditindaklanjuti.","Menyusun tindak lanjut berjenjang: pendampingan intensif bagi 8 guru berkategori cukup dan kurang, penguatan bagi yang baik, serta pelibatan guru amat baik sebagai mentor sebaya.","Menghentikan program supervisi karena mayoritas guru sudah baik."],"k":3,"p":"Tindak lanjut harus terdiferensiasi sesuai data: pendampingan intensif bagi 8 guru kategori cukup dan kurang, penguatan bagi yang baik, dan pemberdayaan guru amat baik sebagai mentor sebaya.","t":"C5 • tindak lanjut supervisi"},{"m":1,"q":"Supervisi manajerial terhadap tenaga perpustakaan madrasah paling tepat difokuskan pada …","o":["Ketertiban pengelolaan koleksi, layanan pemustaka, serta kontribusi program perpustakaan terhadap peningkatan budaya literasi peserta didik.","Kerapian penataan meja dan kebersihan ruang perpustakaan semata.","Jumlah buku yang dibeli pada tahun anggaran berjalan.","Kedisiplinan kehadiran tenaga perpustakaan setiap hari kerja.","Kelengkapan dokumen kepegawaian tenaga perpustakaan."],"k":0,"p":"Supervisi manajerial tenaga kependidikan menilai mutu layanan dan kontribusinya terhadap capaian madrasah, bukan sekadar kerapian fisik atau kelengkapan administrasi.","t":"C5 • supervisi manajerial tenaga kependidikan"},{"m":1,"q":"Seorang guru memperoleh total skor Penilaian Kinerja Guru sebesar 48 dari skor maksimal 56. Nilai PKG dan sebutan kategorinya adalah … (Amat Baik 91–100; Baik 76–90; Cukup 61–75; Sedang 51–60; Kurang ≤50)","o":["85,71 dengan sebutan Baik.","85,71 dengan sebutan Cukup.","75,00 dengan sebutan Cukup.","91,43 dengan sebutan Amat Baik.","116,67 dengan sebutan Amat Baik."],"k":0,"p":"Nilai PKG = (48/56) × 100 = 85,71, berada pada rentang 76–90 sehingga bersebutan Baik.","t":"C4 • penilaian kinerja guru"},{"m":1,"q":"Praktik lesson study yang dipimpin kepala madrasah paling tepat digambarkan sebagai …","o":["Penilaian bersama terhadap guru model oleh seluruh peserta.","Pelatihan berjenjang dengan narasumber dari luar madrasah.","Siklus merancang pembelajaran bersama, mengamati proses belajar murid (bukan menilai guru), lalu merefleksikannya untuk perbaikan rancangan berikutnya.","Kunjungan kelas terjadwal untuk mengisi instrumen penilaian kinerja.","Lomba praktik mengajar antarguru dalam satu rumpun mata pelajaran."],"k":2,"p":"Ciri khas lesson study adalah pengamatan terhadap proses belajar murid, bukan penilaian terhadap guru model, dan berlangsung dalam siklus rancang–amati–refleksi.","t":"C4 • lesson study"},{"m":1,"q":"Seorang guru tampak sangat cemas dan mengajar tidak seperti biasanya ketika disupervisi. Tindakan kepala madrasah yang paling tepat adalah …","o":["Menghentikan observasi dan menjadwalkannya kembali tanpa pemberitahuan.","Menyelesaikan observasi, lalu pada pertemuan balikan membuka percakapan dari sisi guru, menegaskan tujuan supervisi sebagai pendampingan, dan menyepakati fokus perbaikan yang dipilih guru.","Mencatat seluruh kelemahan dan menyampaikannya dalam rapat dewan guru.","Membatalkan supervisi bagi guru tersebut pada tahun berjalan.","Meminta guru mengulang pembelajaran saat itu juga hingga sesuai harapan."],"k":1,"p":"Kecemasan diatasi dengan membangun rasa aman: memulai balikan dari sudut pandang guru, menegaskan tujuan pendampingan, dan memberi guru kendali atas fokus perbaikan.","t":"C5 • etika dan iklim supervisi"},{"m":1,"q":"Dalam menyupervisi penerapan pembelajaran mendalam, indikator utama yang paling tepat diamati adalah …","o":["Kelengkapan modul ajar dan kesesuaian format penulisannya.","Ketepatan waktu guru memulai dan mengakhiri pembelajaran.","Banyaknya media digital yang digunakan dalam satu pertemuan.","Kualitas keterlibatan berpikir murid: kedalaman pertanyaan, keberanian menyampaikan alasan, keterkaitan materi dengan pengalaman nyata, dan adanya ruang refleksi.","Keterlibatan murid dalam menjawab pertanyaan secara serentak dan cepat."],"k":3,"p":"Pembelajaran mendalam tampak pada kualitas keterlibatan berpikir murid — kedalaman pertanyaan, penalaran, keterkaitan dengan pengalaman, dan ruang refleksi — bukan pada kelengkapan dokumen atau banyaknya media.","t":"C5 • supervisi pembelajaran mendalam"},{"m":1,"q":"Hasil supervisi menunjukkan guru menggunakan salindia (slide) berisi teks padat yang dibacakan sepanjang pembelajaran. Rekomendasi yang paling tepat adalah …","o":["Mengarahkan guru menempatkan teknologi sebagai alat bantu berpikir murid — misalnya menyajikan data, simulasi, atau pemantik diskusi — bukan sebagai pengganti penjelasan dan interaksi.","Melarang guru menggunakan salindia dalam pembelajaran.","Meminta guru memperbanyak animasi agar salindia lebih menarik.","Mengganti salindia dengan buku teks konvensional.","Membiarkan karena penggunaan teknologi sudah merupakan kemajuan."],"k":0,"p":"Dalam kerangka TPACK, teknologi seharusnya memperkaya proses berpikir murid, bukan sekadar memindahkan teks dari buku ke layar.","t":"C5 • supervisi pemanfaatan TIK"},{"m":1,"q":"Indikator keberhasilan program supervisi akademik yang paling kuat adalah …","o":["Seluruh guru telah disupervisi sesuai jadwal yang ditetapkan.","Seluruh instrumen dan laporan supervisi terdokumentasi lengkap.","Tingkat kepuasan guru terhadap pelaksanaan supervisi tergolong tinggi.","Jumlah temuan kelemahan guru menurun dibanding tahun sebelumnya.","Terjadi perubahan praktik mengajar yang terverifikasi dan meningkatnya kualitas belajar murid."],"k":4,"p":"Keterlaksanaan jadwal dan kelengkapan dokumen hanyalah indikator proses. Keberhasilan sesungguhnya terlihat pada perubahan praktik mengajar dan peningkatan kualitas belajar murid.","t":"C5 • evaluasi program supervisi"},{"m":2,"q":"Makna kompetensi kewirausahaan bagi kepala madrasah yang paling tepat adalah …","o":["Kemampuan mendirikan dan menjalankan usaha untuk menambah penghasilan madrasah.","Kemampuan menjalin kerja sama dengan dunia usaha dan dunia industri.","Sikap dan kemampuan menciptakan inovasi, bekerja keras, pantang menyerah, dan memiliki naluri kewirausahaan dalam mengelola madrasah demi kemajuan belajar murid — unit usaha hanyalah salah satu wujudnya.","Kemampuan mencari sumber dana tambahan dari masyarakat dan alumni.","Kemampuan memasarkan madrasah agar jumlah pendaftar meningkat."],"k":2,"p":"Kompetensi kewirausahaan kepala madrasah mencakup inovasi, kerja keras, motivasi kuat, pantang menyerah, dan naluri kewirausahaan — unit usaha hanya salah satu perwujudannya.","t":"C4 • hakikat kompetensi kewirausahaan"},{"m":2,"q":"Madrasah berada di daerah sentra pengrajin anyaman bambu, tetapi minat masyarakat menyekolahkan anak ke madrasah menurun. Program unggulan yang paling tepat dikembangkan adalah …","o":["Membuka kelas unggulan olimpiade sains dengan seleksi ketat.","Mengembangkan program kewirausahaan berbasis kriya bambu yang terintegrasi dengan pembelajaran dan melibatkan pengrajin setempat sebagai mitra dan narasumber.","Menurunkan biaya pendidikan serendah mungkin agar lebih menarik.","Menambah kegiatan ekstrakurikuler sebanyak mungkin.","Memasang iklan besar-besaran di jalan utama desa."],"k":1,"p":"Inovasi paling kuat lahir dari potensi lokal dan melibatkan masyarakat, sehingga program bermakna bagi murid sekaligus memulihkan kepercayaan masyarakat.","t":"C5 • inovasi berbasis potensi lokal • cinta tanah air"},{"m":2,"q":"Analisis SWOT madrasah menunjukkan: kekuatan berupa guru yang solid, kelemahan berupa sarana laboratorium terbatas, peluang berupa program CSR perusahaan di sekitar madrasah, dan ancaman berupa persaingan dengan sekolah negeri baru. Strategi yang memanfaatkan peluang untuk mengatasi kelemahan (strategi W-O) adalah …","o":["Meningkatkan promosi madrasah dengan mengandalkan soliditas guru.","Mengurangi praktikum karena laboratorium terbatas.","Menonjolkan keunggulan guru untuk menghadapi persaingan sekolah baru.","Mengajukan proposal kemitraan CSR untuk melengkapi sarana laboratorium madrasah.","Menunggu bantuan sarana dari pemerintah pusat."],"k":3,"p":"Strategi W-O memanfaatkan peluang eksternal (CSR) untuk menutup kelemahan internal (laboratorium terbatas).","t":"C5 • analisis SWOT"},{"m":2,"q":"Unit usaha madrasah memproduksi kemasan makanan ringan. Biaya tetap Rp3.000.000,00 per bulan, biaya variabel Rp9.000,00 per unit, dan harga jual Rp15.000,00 per unit. Jumlah unit yang harus terjual agar mencapai titik impas (BEP) adalah …","o":["200 unit","250 unit","333 unit","375 unit","500 unit"],"k":4,"p":"Margin kontribusi = Rp15.000,00 − Rp9.000,00 = Rp6.000,00. BEP = Rp3.000.000,00 : Rp6.000,00 = 500 unit.","t":"C4 • analisis titik impas"},{"m":2,"q":"Koperasi madrasah memiliki modal usaha Rp12.000.000,00 dan memperoleh omzet Rp15.600.000,00 dalam satu periode, dengan seluruh biaya telah diperhitungkan dalam modal tersebut. Persentase keuntungan terhadap modal adalah …","o":["18%","23%","25%","30%","36%"],"k":3,"p":"Keuntungan = Rp15.600.000,00 − Rp12.000.000,00 = Rp3.600.000,00. Persentase = 3.600.000/12.000.000 × 100% = 30%.","t":"C4 • analisis keuntungan usaha"},{"m":2,"q":"Harga pokok produksi satu unit produk unit usaha madrasah adalah Rp8.000,00. Jika madrasah menetapkan margin keuntungan 25% dari harga pokok, harga jual per unit adalah …","o":["Rp8.250,00","Rp9.000,00","Rp10.000,00","Rp10.667,00","Rp12.000,00"],"k":2,"p":"Harga jual = Rp8.000,00 + (25% × Rp8.000,00) = Rp10.000,00.","t":"C3 • penetapan harga jual"},{"m":2,"q":"Nilai utama keberadaan unit produksi di madrasah yang paling tepat adalah …","o":["Menjadi wahana belajar nyata bagi peserta didik dalam berwirausaha, sementara keuntungan finansial merupakan manfaat turunan.","Menjadi sumber pendapatan utama untuk menutupi kekurangan anggaran madrasah.","Menjadi sarana meningkatkan kesejahteraan pendidik dan tenaga kependidikan.","Menjadi bukti fisik keberhasilan kepala madrasah dalam berinovasi.","Menjadi daya tarik utama dalam penerimaan peserta didik baru."],"k":0,"p":"Unit produksi di lembaga pendidikan berfungsi utama sebagai wahana belajar nyata bagi peserta didik; keuntungan finansial adalah manfaat ikutan, bukan tujuan utama.","t":"C5 • unit produksi sebagai wahana belajar"},{"m":2,"q":"Sebuah perusahaan menawarkan bantuan dana CSR dengan syarat logo perusahaan dipasang di seluruh ruang kelas dan produknya dipromosikan kepada peserta didik. Sikap kepala madrasah yang paling tepat adalah …","o":["Menerima seluruh syarat karena madrasah sangat membutuhkan dana.","Menolak seluruh bentuk kerja sama dengan pihak swasta.","Menerima dana dan mengabaikan syarat promosi setelah dana cair.","Menegosiasikan bentuk kerja sama yang tidak menjadikan peserta didik sebagai sasaran pemasaran, dengan kesepakatan tertulis dan tetap terbuka kepada komite serta warga madrasah.","Menyerahkan keputusan sepenuhnya kepada komite madrasah."],"k":3,"p":"Kemitraan tetap dapat diterima sepanjang murid tidak dijadikan sasaran pemasaran, kesepakatan dituangkan tertulis, dan prosesnya terbuka kepada komite serta warga madrasah.","t":"C5 • etika kemitraan • perlindungan murid"},{"m":2,"q":"Madrasah menerima wakaf berupa sebidang tanah produktif. Pemanfaatan yang paling sesuai dengan prinsip wakaf produktif adalah …","o":["Mengelola tanah tersebut sebagai lahan produktif yang hasilnya dimanfaatkan berkelanjutan untuk madrasah, dengan pokok wakaf tetap terjaga dan dikelola secara akuntabel.","Menjual tanah tersebut dan menggunakan hasilnya untuk pembangunan gedung.","Membiarkan tanah tersebut tetap kosong agar statusnya aman.","Menyewakannya kepada pengurus madrasah dengan harga khusus.","Menukarnya dengan aset lain yang lebih mudah dikelola tanpa prosedur resmi."],"k":0,"p":"Prinsip wakaf produktif: pokok wakaf dijaga keutuhannya, sedangkan hasil pengelolaannya dimanfaatkan secara berkelanjutan dan akuntabel untuk kemaslahatan.","t":"C5 • wakaf produktif • cinta Allah"},{"m":2,"q":"Pengelolaan hasil unit usaha madrasah yang paling tepat adalah …","o":["Dicatat terpisah dari keuangan madrasah agar tidak memengaruhi laporan.","Digunakan langsung sesuai kebutuhan mendesak tanpa pembukuan rinci.","Dibagikan sebagai insentif kepada pengelola pada setiap akhir bulan.","Disimpan oleh kepala madrasah sebagai dana cadangan tak terduga.","Dibukukan tertib, diaudit internal, dilaporkan kepada komite dan warga madrasah, serta digunakan sesuai rencana yang telah disepakati."],"k":4,"p":"Hasil usaha madrasah adalah dana publik yang menuntut pembukuan tertib, audit internal, pelaporan terbuka, dan penggunaan sesuai rencana yang disepakati.","t":"C5 • akuntabilitas hasil usaha"},{"m":2,"q":"Rencana membuka usaha katering madrasah menghadapi kemungkinan bahan baku rusak, pesanan sepi, dan keluhan mutu. Wujud manajemen risiko usaha yang paling tepat adalah …","o":["Menyiapkan modal cadangan yang besar sebelum memulai usaha.","Membatalkan rencana usaha karena risikonya terlalu banyak.","Menyerahkan pengelolaan kepada pihak ketiga agar risiko berpindah.","Mengidentifikasi setiap risiko, menakar peluang dan dampaknya, lalu menyiapkan langkah pencegahan dan penanganan — termasuk uji pasar skala kecil sebelum produksi penuh.","Memulai usaha dan memperbaiki masalah setelah muncul di lapangan."],"k":3,"p":"Manajemen risiko usaha menuntut identifikasi risiko, penakaran peluang dan dampak, langkah mitigasi, serta uji pasar skala kecil sebelum produksi penuh.","t":"C5 • manajemen risiko usaha"},{"m":2,"q":"Strategi membangun citra madrasah yang paling berkelanjutan adalah …","o":["Memperbanyak spanduk dan baliho menjelang penerimaan peserta didik baru.","Menampilkan hanya prestasi terbaik dan menyembunyikan kelemahan madrasah.","Membangun mutu layanan dan prestasi secara nyata, lalu mengomunikasikannya secara jujur dan konsisten melalui kanal resmi serta kesaksian alumni dan orang tua.","Mengunggah kegiatan harian sebanyak mungkin ke media sosial.","Menyewa jasa promosi profesional dengan anggaran besar."],"k":2,"p":"Citra yang berkelanjutan bertumpu pada mutu nyata yang dikomunikasikan secara jujur dan konsisten, bukan pada promosi musiman atau penyembunyian kelemahan.","t":"C5 • branding madrasah"},{"m":2,"q":"Sebuah koperasi madrasah menawarkan pinjaman kepada guru dengan tambahan pengembalian tetap sebesar 10% dari pokok pinjaman setiap bulan, tanpa kaitan dengan hasil usaha. Pertimbangan kepala madrasah yang paling tepat adalah …","o":["Menyetujui karena keuntungan koperasi menjadi lebih pasti.","Meninjau ulang skema tersebut karena mengandung unsur riba, dan menggantinya dengan akad yang sesuai syariah seperti murabahah, mudarabah, atau qardhul hasan.","Menyetujui selama seluruh anggota koperasi menyepakatinya.","Menurunkan tambahan pengembalian menjadi 5% agar lebih ringan.","Menyerahkan keputusan sepenuhnya kepada pengurus koperasi."],"k":1,"p":"Tambahan pengembalian tetap atas pokok pinjaman tanpa keterkaitan dengan hasil usaha mengandung unsur riba. Alternatifnya adalah akad jual beli (murabahah), bagi hasil (mudarabah), atau pinjaman kebajikan (qardhul hasan).","t":"C5 • etika bisnis syariah • cinta Allah"},{"m":2,"q":"Unit usaha budi daya ikan madrasah mengalami kerugian pada tahun pertama. Sikap kepala madrasah yang paling mencerminkan jiwa kewirausahaan adalah …","o":["Menghentikan seluruh program kewirausahaan agar tidak merugi lagi.","Menutupi kerugian dengan dana kegiatan lain agar tidak terlihat.","Mengalihkan tanggung jawab kerugian kepada guru pengelola.","Mengganti usaha dengan jenis lain yang sedang populer tanpa kajian.","Menganalisis penyebab kerugian bersama tim, memperbaiki proses yang bermasalah, dan menjadikannya bahan pembelajaran nyata bagi peserta didik sebelum memutuskan langkah berikutnya."],"k":4,"p":"Jiwa kewirausahaan tampak pada sikap pantang menyerah yang disertai evaluasi jujur: menganalisis penyebab, memperbaiki proses, dan menjadikan kegagalan sebagai bahan belajar bagi murid.","t":"C5 • pantang menyerah dan keteladanan"},{"m":2,"q":"Madrasah menanamkan investasi Rp20.000.000,00 untuk peralatan unit usaha dan memperoleh laba bersih Rp5.000.000,00 per tahun. Tingkat pengembalian investasi (ROI) dan perkiraan waktu balik modal adalah …","o":["20% per tahun; balik modal 5 tahun.","25% per tahun; balik modal 4 tahun.","25% per tahun; balik modal 5 tahun.","40% per tahun; balik modal 2,5 tahun.","400% per tahun; balik modal 4 bulan."],"k":1,"p":"ROI = 5.000.000/20.000.000 × 100% = 25% per tahun. Waktu balik modal = 20.000.000 : 5.000.000 = 4 tahun.","t":"C4 • analisis kelayakan investasi"}];
const MOD=["Manajerial","Supervisi","Kewirausahaan"];
const CNT=MOD.map((_,i)=>Q.filter(q=>q.m==i).length);
const L="ABCDE",KEY="bs-akgtk-kamad-v1",$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=x=>x.toLocaleString("id-ID",{maximumFractionDigits:1});
let U="";try{U=localStorage.getItem("bs-akgtk-kamad-user")||""}catch(e){}
let S={view:U?"dash":"login"},TM=null,CF=false,FL="semua",cfg={mod:-1,n:40,mode:"latihan",dur:150,acak:true};
function hk(){return KEY+":"+U.toLowerCase()}
function hist(){try{return JSON.parse(localStorage.getItem(hk()))||[]}catch(e){return[]}}
function saveH(r){try{const h=hist();h.unshift(r);localStorage.setItem(hk(),JSON.stringify(h.slice(0,12)))}catch(e){}}
function start(ids){
 clearInterval(TM);CF=false;
 if(!ids){ids=Q.map((_,i)=>i).filter(i=>cfg.mod<0||Q[i].m==cfg.mod);
  if(cfg.acak)for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  ids=ids.slice(0,Math.max(1,Math.min(cfg.n,ids.length)))}
 S={view:"quiz",ids,i:0,ans:{},flag:{},mode:cfg.mode,end:cfg.mode=="ujian"?Date.now()+cfg.dur*60000:null,mod:cfg.mod};
 if(S.end)TM=setInterval(tick,1000);
 render()}
function tick(){const s=Math.max(0,Math.round((S.end-Date.now())/1000)),el=$("tm");
 if(el)el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
 if(s<=0)finish()}
function finish(){
 clearInterval(TM);
 const per=MOD.map(()=>[0,0]);let b=0,k=0;
 S.ids.forEach(id=>{const q=Q[id],a=S.ans[id];per[q.m][1]++;if(a==null)k++;else if(a==q.k){b++;per[q.m][0]++}});
 S.res={b,k,s:S.ids.length-b-k,n:S.ids.length,per};S.view="result";FL="semua";
 saveH({t:new Date().toLocaleDateString("id-ID"),m:S.mod<0?"Semua dimensi":MOD[S.mod],n:S.ids.length,b,mode:S.mode});
 render()}
function login(){
 return `<h1>Latihan Soal AKGTK Kepala Madrasah 2026</h1><p class="mute">Masukkan nama Anda untuk memulai. Riwayat latihan tersimpan atas nama ini di peramban Anda.</p>
 <div class="card"><label for="nm">Nama peserta</label><input type="text" id="nm" maxlength="60" autocomplete="name"><div class="acts"><button data-a="login">Masuk</button></div><p class="tag" id="er"></p></div>`}
function doLogin(){
 const v=$("nm").value.trim().replace(/\s+/g," ");
 if(v.length<2){$("er").textContent="Tulis nama minimal 2 huruf.";return}
 U=v;try{localStorage.setItem("bs-akgtk-kamad-user",U)}catch(e){}
 S={view:"dash"};render()}
function best(i){
 const r=hist().filter(x=>x.m==MOD[i]).sort((a,b)=>b.b/b.n-a.b/a.n)[0];
 return r?fmt(r.b/r.n*100)+" ("+r.n+" soal)":null}
function dash(){
 const h=hist();
 return `<div class="bar"><div><h1>Dashboard</h1><span class="mute">Peserta: ${esc(U)}</span></div><button class="alt" data-a="logout">Keluar</button></div>
 <p class="mute">Pilih dimensi yang ingin Anda latih, atau kerjakan simulasi penuh.</p>
 <div class="menu">${MOD.map((m,i)=>{const b=best(i);return `<button class="m" data-a="aspek" data-j="${i}"><b>${i+1}. ${m}</b><span class="mute">${CNT[i]} soal. ${b?"Nilai terbaik "+b:"Belum pernah dilatih"}</span></button>`}).join("")}</div>
 <div class="acts"><button data-a="sim">Simulasi penuh: ${Q.length} soal, 150 menit</button><button class="alt" data-a="aspek" data-j="-1">Latihan campuran semua dimensi</button></div>
 ${h.length?`<h2>Riwayat terakhir</h2><div class="card"><table><tr><th>Tanggal</th><th>Dimensi</th><th>Mode</th><th>Benar</th></tr>${h.map(r=>`<tr><td>${r.t}</td><td>${esc(r.m)}</td><td>${r.mode}</td><td>${r.b}/${r.n}</td></tr>`).join("")}</table></div>`:""}`}
function home(){
 const t=cfg.mod<0?"Semua dimensi (campuran)":MOD[cfg.mod],mx=cfg.mod<0?Q.length:CNT[cfg.mod];
 return `<div class="bar"><h1>${t}</h1><button class="alt" data-a="dash">Kembali ke dashboard</button></div>
 <p class="mute">Atur jumlah soal dan mode latihan.</p>
 <div class="card">
 <div class="row"><label for="cn">Jumlah soal (maksimal ${mx})</label><input type="number" id="cn" min="1" max="${mx}"></div>
 <div class="row"><label for="cmd">Mode</label><select id="cmd"><option value="latihan">Latihan: pembahasan langsung</option><option value="ujian">Ujian: hasil di akhir, ada pewaktu</option></select></div>
 <div class="row" id="rd"><label for="cd">Durasi ujian (menit)</label><input type="number" id="cd" min="1" max="300"></div>
 <div class="row"><label for="ca">Acak urutan soal</label><input type="checkbox" id="ca"></div>
 <div class="acts"><button data-a="start">Mulai</button></div></div>`}
function quiz(){
 const id=S.ids[S.i],q=Q[id],a=S.ans[id],lock=S.mode=="latihan"&&a!=null,n=S.ids.length;
 const opts=q.o.map((t,j)=>{let c="opt";if(lock)c+=j==q.k?" ok":j==a?" no":"";else if(a==j)c+=" sel";
  return `<button class="${c}" data-a="pick" data-j="${j}"><b>${L[j]}.</b><span>${esc(t)}</span></button>`}).join("");
 const nav=S.ids.map((x,i)=>`<button data-a="go" data-j="${i}" class="${S.ans[x]!=null?"done ":""}${S.flag[x]?"fl ":""}${i==S.i?"cur":""}" aria-label="Soal ${i+1}">${i+1}</button>`).join("");
 const last=S.i==n-1,un=S.ids.filter(x=>S.ans[x]==null).length;
 return `<div class="bar"><span class="tag">${MOD[q.m]}, soal ${S.i+1} dari ${n}</span>${S.end?`<b id="tm"></b>`:""}<button class="alt" data-a="leave">${S.leave?"Jawaban hilang. Klik lagi untuk keluar":"Kembali ke dashboard"}</button></div>
 <div class="card"><p class="q">${esc(q.q)}</p>${opts}${lock?`<p class="pem"><b>${a==q.k?"Benar.":"Salah. Kunci: "+L[q.k]+"."}</b> ${esc(q.p)}</p>`:""}
 <div class="acts"><button class="alt" data-a="prev" ${S.i?"":"disabled"}>Sebelumnya</button>
 ${last?`<button data-a="fin">${CF&&un?`Masih ${un} kosong. Klik lagi untuk kumpulkan`:"Kumpulkan"}</button>`:`<button data-a="next">Berikutnya</button>`}
 ${S.mode=="ujian"?`<button class="alt" data-a="flag">${S.flag[id]?"Hapus tanda ragu":"Tandai ragu"}</button>`:""}</div></div>
 <div class="card"><div class="tag">Navigasi soal</div><div class="nav">${nav}</div>${last?"":`<div class="acts"><button class="alt" data-a="fin">${CF?"Klik lagi untuk kumpulkan":"Kumpulkan sekarang"}</button></div>`}</div>`}
function result(){
 const r=S.res,p=r.b/r.n*100;
 const rows=r.per.map((x,i)=>x[1]?`<tr><td>${MOD[i]}</td><td>${x[0]} dari ${x[1]}</td><td>${fmt(x[0]/x[1]*100)}</td></tr>`:"").join("");
 const list=S.ids.map((id,i)=>{const q=Q[id],a=S.ans[id],st=a==null?"kosong":a==q.k?"benar":"salah";
  if(FL!="semua"&&FL!=st)return"";
  return `<div class="rv"><div class="tag">Soal ${i+1}, ${MOD[q.m]}${q.t?" • "+esc(q.t):""}</div><p class="q">${esc(q.q)}</p>
  <div class="${st=="benar"?"good":"badc"}">Jawaban Anda: ${a==null?"kosong":L[a]+". "+esc(q.o[a])}</div>
  <div class="good">Kunci: ${L[q.k]}. ${esc(q.o[q.k])}</div><p class="pem">${esc(q.p)}</p></div>`}).join("");
 return `<h1>Hasil latihan</h1><p class="mute">Peserta: ${esc(U)}</p><div class="card"><div class="big">${fmt(p)}</div><div class="mute">${r.b} benar, ${r.s} salah, ${r.k} kosong dari ${r.n} soal</div></div>
 <div class="card"><table><tr><th>Dimensi</th><th>Benar</th><th>Nilai</th></tr>${rows}</table></div>
 <div class="acts"><button data-a="retry" ${r.s+r.k?"":"disabled"}>Ulangi soal yang salah dan kosong</button><button class="alt" data-a="dash">Kembali ke dashboard</button></div>
 <h2>Pembahasan</h2><div class="acts">${["semua","salah","kosong","benar"].map(f=>`<button class="${f==FL?"":"alt"}" data-a="fl" data-f="${f}">${f}</button>`).join("")}</div>${list||`<p class="mute">Tidak ada soal pada kategori ini.</p>`}`}
function render(){
 $("app").innerHTML=({login,dash,home,quiz,result})[S.view]();
 if(S.view=="home"){$("cn").value=cfg.n;$("cmd").value=cfg.mode;$("cd").value=cfg.dur;$("ca").checked=cfg.acak;$("rd").style.display=cfg.mode=="ujian"?"":"none"}
 if(S.view=="login")$("nm").value=U;
 if(S.view=="quiz"&&S.end)tick();
 window.scrollTo(0,0)}
function rc(){cfg={mod:cfg.mod,n:+$("cn").value||40,mode:$("cmd").value,dur:+$("cd").value||60,acak:$("ca").checked}}
$("app").addEventListener("change",e=>{if(S.view!="home")return;rc();$("rd").style.display=cfg.mode=="ujian"?"":"none"});
$("app").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="nm")doLogin()});
$("app").addEventListener("click",e=>{
 const b=e.target.closest("button[data-a]");if(!b)return;
 const a=b.dataset.a,j=+b.dataset.j,id=S.ids&&S.ids[S.i];
 if(S.view=="quiz"&&a!="leave")S.leave=false;
 if(a=="login")doLogin();
 else if(a=="logout"){clearInterval(TM);U="";try{localStorage.removeItem("bs-akgtk-kamad-user")}catch(x){}S={view:"login"};render()}
 else if(a=="aspek"){cfg.mod=j;cfg.n=j<0?Q.length:CNT[j];cfg.dur=cfg.n*3;S={view:"home"};render()}
 else if(a=="sim"){cfg={mod:-1,n:Q.length,mode:"ujian",dur:150,acak:false};start()}
 else if(a=="dash"){clearInterval(TM);S={view:"dash"};render()}
 else if(a=="leave"){if(Object.keys(S.ans).length&&!S.leave){S.leave=true;render()}else{clearInterval(TM);S={view:"dash"};render()}}
 else if(a=="start"){rc();start()}
 else if(a=="pick"){if(S.mode=="latihan"&&S.ans[id]!=null)return;S.ans[id]=j;CF=false;render()}
 else if(a=="go"){S.i=j;CF=false;render()}
 else if(a=="prev"){S.i--;render()}
 else if(a=="next"){S.i++;render()}
 else if(a=="flag"){S.flag[id]=!S.flag[id];render()}
 else if(a=="fin"){const un=S.ids.filter(x=>S.ans[x]==null).length;if(un&&!CF){CF=true;render()}else finish()}
 else if(a=="fl"){FL=b.dataset.f;render()}
 else if(a=="retry"){const ids=S.ids.filter(x=>S.ans[x]!==Q[x].k);cfg.mode="latihan";start(ids)}});
render();
</script>
</body>
</html>
